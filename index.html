<!DOCTYPE html>
<html lang="es" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro Dieta Iao</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5', 100: '#d1fae5', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b',
                        },
                        darkbg: '#0F172A',
                        darkcard: '#1E293B',
                        darkborder: '#334155'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #F8FAFC; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .touch-active:active { transform: scale(0.96); }
        [v-cloak] { display: none; }
    </style>
</head>
<body class="h-full bg-darkbg text-slate-100 antialiased selection:bg-brand-500 selection:text-white">
    <div id="app" class="min-h-full flex flex-col max-w-md md:max-w-3xl mx-auto bg-darkbg shadow-2xl relative pb-24" v-cloak>
        <!-- HEADER SUPERIOR -->
        <header class="sticky top-0 z-30 bg-darkbg/90 backdrop-blur-md border-b border-darkborder px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white shadow-lg shadow-brand-500/20 font-bold text-lg">
                    🥗
                </div>
                <div>
                    <h1 class="text-base font-bold leading-tight text-white tracking-wide">Registro Dieta Iao</h1>
                    <p class="text-xs text-slate-400">Seguimiento & Equivalencias</p>
                </div>
            </div>
            <!-- Cumplimiento -->
            <div class="flex items-center gap-2">
                <div class="text-right">
                    <div class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Cumplimiento</div>
                    <div class="text-xs font-extrabold text-emerald-400">100%</div>
                </div>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="flex-1 p-4 overflow-y-auto">
            <section class="space-y-4">
                <div class="bg-darkcard border border-darkborder p-4 rounded-2xl">
                    <h2 class="text-lg font-bold text-white mb-2">¡Bienvenido a Dieta Iao!</h2>
                    <p class="text-xs text-slate-300 leading-relaxed">
                        Aplicación web optimizada para el control nutricional diario, cálculo de equivalencias y registro sincronizado mediante AppSheet y Google Sheets.
                    </p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
